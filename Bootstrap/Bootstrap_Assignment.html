
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Assignment - Pricing page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">
    <div class="text-center">
        <h1>Pricing</h1>
        <h6>Please checkout our most effective payment models</h6>
    </div>

    <div class="row mt-4">

        <!-- Card 1 -->
        <div class="col-6 col-md-4">
            <div class="card mb-3">
                <div class="card-header text-center fs-5 fw-bold">
                    Free
                </div>

                <div class="card-body">
                    <h5 class="card-title text-center fs-2">$0 / mo</h5>
                    <h6 class="card-text text-center">10 users included</h6>
                    <h6 class="card-text text-center">2 GB of storage</h6>
                    <h6 class="card-text text-center">Email support</h6>

                    <div class="text-center">
                        <button class="btn btn-outline-primary">
                            Sign up for free
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="col-6 col-md-4">
            <div class="card mb-3">
                <div class="card-header text-center fs-5 fw-bold">
                    Pro
                </div>

                <div class="card-body">
                    <h5 class="card-title text-center fs-2 ">$15 / mo</h5>
                    <h6 class="card-text text-center">20 users included</h6>
                    <h6 class="card-text text-center">10 GB of storage</h6>
                    <h6 class="card-text text-center">Priority email support</h6>

                    <div class="text-center">
                        <button class="btn btn-primary">
                            Get Started
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="col col-md-4">
            <div class="card mb-3">
                <div class="card-header text-center fs-5 fw-bold">
                    Enterprise
                </div>

                <div class="card-body">
                    <h5 class="card-title text-center fs-2">$29 / mo</h5>
                    <h6 class="card-text text-center">30 users included</h6>
                    <h6 class="card-text text-center">15 GB of storage</h6>
                    <h6 class="card-text text-center">Phone & Email support</h6>

                    <div class="text-center">
                        <button class="btn btn-primary">
                            Contact Us
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
