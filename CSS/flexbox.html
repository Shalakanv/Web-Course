<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Properties</title>
    <link href="flexbox.css" rel="stylesheet">
</head>
<body>
    <!-- Flexbox - flexible box layout ( used to make responsive website ) -->
     <!-- flexbox ==> we understand in terms of axis ( main axis i.e. we can say X in terms of row and cross i.e.Y axis and exactly opposite in terms of column) -->

     <h1>Flexbox Playground</h1>
     <div id="container">
        <div style="background-color: #9400d3;">violet</div>
        <div style="background-color: #4b0082;">Indigo</div>
        <div id="blue" style="background-color: #0000ff;height: 75px;">Blue</div>
        <div style="background-color: #00ff00;">Green</div>
        <div style="background-color: #ffff00;">Yellow</div>
        <div id="orange" style="background-color: #ff7f00;height: 200px;font-size:3.5em;">Orange</div>
        <div style="background-color: #ff0000;">Red</div>
     </div>
</body>
</html>
