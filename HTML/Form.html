<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in html</title>
</head>
<body>
    <form action="/action">
        <!-- two differemt ways of using label tag  -->
        <label>
            Enter Username:
            <input type="text" placeholder="enter username" name="user">
        </label>
        <br>
        <div>
            <label for="password">Enter Password:</label>
            <input type="password" id="password" placeholder="enter password" name="pass"> 
        </div>

        <div>
            <input type="checkbox" id="age" name="age">
            <!-- checkbox tick karun submit kela tr url madhe age=on aani nhi tick karun submit kela tr age=off aani by default check hava asel tr input madhe checked add karne -->
            <!-- jr aaplyla checkbox la group karych asel tr name same thevayche saglyche  -->
            <label for="age">I am 18+</label>
            <br>
            <hr>

            Select Subjects:
            <input type="checkbox" id="math" name="subjects" value="math">
            <label for="math">Math</label>
            <input type="checkbox" id="science" name="subjects" value="science">
            <label for="science">Science</label>
            <input type="checkbox" id="english" name="subjects" value="english">
            <label for="english">English</label>
        </div>


        <div>
            <input type="radio" name="fruits" id="mango" value="mango">
            <label for="mango">Mango</label>
            <input type="radio" name="fruits" id="apple" value="apple">
            <label for="apple">Apple</label>
            <input type="radio" name="fruits" id="banana" value="banana">
            <label for="banana">Banana</label>
            <!-- group kelynantr pn ekch radio button select karu shakto -->
        </div>

        <div>
            Choose your Profession:
            <select name="profession" id="profession">
                <option>Select your option</option>
                <option value="stu">Student</option>
                <option value="dev">Developer</option>
            </select>
        </div>

        <label for="vol">Select your volume level:</label>
        <input type="range" id="vol" name="vol" min="0" max="100" step="10" value="70">
        <br>

        <label for="feedback">Write your valuable feedback here:</label>
        <textarea id="feedback" name="feedback" placeholder="write your feedback here"></textarea>

        <button>Submit</button>

        <!-- form madhe enter kelela data backend kiva aaction madhe enetr kelely url madhe name=value pair madhe jato -->

        <!-- In button,we have 3 different types -- submit,reset,button -->
         <!-- <button type="submit">Submit me</button> -->
         <!-- <button type="button">Click me</button> -->
         <!-- <button type="reset">Reset</button>

         <input type="button" value="Click me ">
          <input type="submit" value="Click me bt2 "> -->
    </form>

</body>
</html>
