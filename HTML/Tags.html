<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags in html</title>
</head>
<body>
    <!-- Unordered List  -->
    <ul>
        <li>Dosa</li>
        <li>Idli</li>
        <li>Samosa</li>
        <li>Kachori</li>
        <li>Ice-cream</li>
    </ul>

    <!-- Ordered List -->
     <ol type="1">
        <li>Dosa</li>
        <li>Idli</li>
        <li>Samosa</li>
        <li>Kachori</li>
        <li>Ice-cream</li>
     </ol>

     <!-- Anchor tag --- Links  -->
      <a href="https://www.google.com/">Google</a>
      <a href="https://www.netflix.com/in/">Netflix</a>

    <!-- 
      Absolut links --- Links like google,netflix
      relative links ---- links to files in different folder ( to connect web pages ) 
     -->

     <!-- Image tag  -->
      <!-- <img src="Laundry.png" alt="Laundry Image"> -->
      <!-- here also we can have absolute and relative links -->

      <!-- Paragraph,break line,bold,Italic,underline -->

      <p>Twinkle Twinkle Little Star How I Wonder What You Are</p>

      <p><b>Twinkle Twinkle</b> <br> <i>Little Star</i> <br> <u>How I Wonder</u> <br> What You Are</p>

</body>
</html>
