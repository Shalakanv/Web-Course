    <!-- *************************************************************************************************** -->

    <table border="black">
        <caption>Food Menu</caption>
        <thead>
            <tr>
                <th rowspan="2">Items</th>
                <th colspan="2">price</th>
            </tr>
            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
                <td>0.14</td>
            </tr>
              <tr>
                <td>Samosa</td>
                <td>12</td>
                <td>0.17</td>
            </tr>
              <tr>
                <td>Chips</td>
                <td>30</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>
</body>

<!-- 
tr -- to add row in table
th - to add header to table
td - to add data to table
thead -header part of table
tbody - body of table
tfoot - footer of table -->

<!-- colspan and rowspan are used to create cells which spans over multiple rows and columns  -->
