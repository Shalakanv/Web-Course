    <!-- *********************************** Q3 ********************************* -->

    <h1>Feedback Form</h1>

    <form action="/server">

        <div>
            <label for="name">Name:</label>
            <input type="text" name="fullname" id="name" placeholder="Write your name" value="name">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Write your email" value="email">
        </div>

        <br>
        <div>
            <label for="feedback">Message:</label>
            <br>
            <textarea name="feedback" id="feedback" rows="4" cols="30"></textarea>
        </div>
        <br>

        <div>
            Rate us our of 5:
            <br>
            <input type="radio" id="1" name="rate" value="one">
            <label for="1">1</label>
            <br>
            <input type="radio" id="2" name="rate" value="two">
            <label for="2">2</label>
            <br>
            <input type="radio" id="3" name="rate" value="three">
             <label for="3">3</label>
            <br>
            <input type="radio" id="4" name="rate" value="four">
            <label for="4">4</label>
            <br>
            <input type="radio" id="5" name="rate" value="five">
            <label for="5">5</label>
        </div>

        <br>
        <button>Send your message!</button>

    </form>
